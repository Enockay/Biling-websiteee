version: "3.9"

services:
  billing:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: billing-web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.billing.rule=Host(`billing.blackie-networks.com`)"
      - "traefik.http.routers.billing.entrypoints=http"
      - "traefik.http.services.billing.loadbalancer.server.port=80"

networks:
  coolify:
    external: true
